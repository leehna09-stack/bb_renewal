:root{

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
/* 네이버 기본 타이포그래피 적용: 시스템 한글 폰트 스택 / 14px / line-height 1.5, 여백은 8px 그리드 */
body{font-family:'Apple SD Gothic Neo','Helvetica Neue','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;color:var(--tp);font-size:14px;line-height:1.5;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── 상단 바 ── */
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 16px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.05);z-index:10}
.topbar img{width:96px;height:auto;display:block}
.topbar-title{font-size:15px;font-weight:800;color:var(--tp)}
.topbar-title small{font-size:12px;font-weight:500;color:var(--tm);margin-left:8px}
.topbar-utils{margin-left:auto;display:flex;align-items:center;gap:8px}
.now-viewing{font-size:13px;color:var(--ts);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:8px 16px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-viewing b{color:var(--rose)}
.top-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:var(--ts);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;text-decoration:none}
.top-btn:hover{border-color:var(--navy);color:var(--navy)}
.top-btn i{font-size:12px}

/* ── 레이아웃 ── */
.layout{flex:1;display:flex;min-height:0}

/* 좌측 페이지 목록 */
.nav{width:256px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:16px 0 24px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:#D8DEE8;border-radius:3px}
.nav-group{padding:8px 16px 8px}
.nav-group-title{font-size:12px;font-weight:800;color:var(--tm);text-transform:uppercase;letter-spacing:.05em;padding:0 8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.nav-group-title i{font-size:11px;color:var(--rose)}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;background:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:500;color:var(--ts);cursor:pointer;text-align:left;transition:all .12s;line-height:1.5}
.nav-item:hover{background:#FFF5F7;color:var(--rose)}
.nav-item.active{background:var(--rose);color:#fff;font-weight:700}
.nav-item.active .nav-file{color:rgba(255,255,255,.7)}
.nav-item i{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.nav-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-file{display:block;font-size:11px;font-weight:400;color:var(--tm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}

/* 우측 프레임 */
.viewer{flex:1;min-width:0;display:flex;flex-direction:column;background:#E9ECF1;align-items:center;justify-content:center;overflow:hidden}
.viewer iframe{flex:1;width:100%;border:none;background:#fff;align-self:stretch}
/* 모바일 프리뷰: 폰 프레임 */

<script>
var frame = document.getElementById('pageFrame');
var viewer = document.getElementById('viewer');
var nowViewing = document.getElementById('nowViewing');
var openNewTab = document.getElementById('openNewTab');
var items = document.querySelectorAll('.nav-item');

function setActive(page, label) {
  items.forEach(function (it) {
    it.classList.toggle('active', it.getAttribute('data-page') === page);
  });
  nowViewing.innerHTML = '현재 페이지: <b>' + label + '</b>';
  openNewTab.href = page;
}

items.forEach(function (it) {
  it.addEventListener('click', function () {
    var page = it.getAttribute('data-page');
    var isMobile = it.hasAttribute('data-mobile');
    frame.src = encodeURI(page);
    viewer.classList.toggle('is-mobile', isMobile);
    setActive(page, it.querySelector('.nav-item-label').childNodes[0].textContent);
  });
});

// iframe 내부 링크 이동 시 목록 active 동기화
frame.addEventListener('load', function () {
  try {
    var file = decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop());
    var match = null;
    items.forEach(function (it) {
      var p = it.getAttribute('data-page');
      if (p === file || p === '../mobile/' + file) match = it;
    });
    if (match) {
      viewer.classList.toggle('is-mobile', match.hasAttribute('data-mobile'));
      setActive(match.getAttribute('data-page'), match.querySelector('.nav-item-label').childNodes[0].textContent);
    } else if (file) {
      nowViewing.innerHTML = '현재 페이지: <b>' + file + '</b>';
      openNewTab.href = file;
    }
  } catch (e) { /* 다른 출처(file://)에서는 동기화 생략 */ }
});

function reloadFrame() {
  frame.src = frame.src;
}

// 초기 active 표시
setActive('web_main.html', '메인');
</script>
